rules:
  - id: devsecops-demo-only-secret
    category: devsecops-demo
    title: Synthetic DevSecOps demo secret fixture
    severity: CRITICAL
    path: .*app\.py
    keywords:
      - DEVSECOPS_DEMO_ONLY_NOT_A_CREDENTIAL
    regex: (?P<key>DEVSECOPS_DEMO_ONLY_NOT_A_CREDENTIAL)\s*=\s*["'](?P<secret>[a-z0-9-]{20,128})["']
    secret-group-name: secret
