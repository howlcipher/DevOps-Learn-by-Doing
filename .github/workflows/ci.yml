name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: flake8 src tests projects/api_platform/app projects/api_platform/tests
      - name: Type check platform
        run: mypy
      - name: Type check demo app
        run: cd projects/api_platform && mypy app --strict
      - name: Test
        run: pytest
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: Terraform fmt check
        run: terraform fmt -check -recursive projects/api_platform/infra/terraform
      - name: Terraform init (no backend, no credentials)
        run: terraform -chdir=projects/api_platform/infra/terraform init -backend=false -input=false
      - name: Terraform validate
        run: terraform -chdir=projects/api_platform/infra/terraform validate
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install platform
        run: pip install -e ".[dev]"
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
      - name: Install Conftest
        env:
          CONFTEST_VERSION: 0.69.0
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar --extract --gzip --file /tmp/conftest.tar.gz --directory /usr/local/bin conftest
          conftest --version
      - name: Select comparison base
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: echo "ref=${PR_BASE:-$BEFORE}" >> "$GITHUB_OUTPUT"
      - name: Security gate
        run: >-
          devops-learn security scan projects/api_platform
          --base-ref "${{ steps.base.outputs.ref }}"
          --report artifacts/security/security-report.json
      - name: Upload sanitized security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: artifacts/security/security-report.json
          if-no-files-found: warn

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build packages
        run: |
          pip install build
          python -m build
      - name: Test installation
        run: |
          python -m venv test-venv
          test-venv/bin/pip install dist/*.whl
      - name: Smoke test CLI
        run: |
          # Test outside the repository to ensure no accidental source dependencies
          cd /tmp
          $GITHUB_WORKSPACE/test-venv/bin/devops-learn
          $GITHUB_WORKSPACE/test-venv/bin/devops-learn --help
          $GITHUB_WORKSPACE/test-venv/bin/devops-learn doctor
          $GITHUB_WORKSPACE/test-venv/bin/devops-learn report --help
          $GITHUB_WORKSPACE/test-venv/bin/devops-learn ai-test --help
          $GITHUB_WORKSPACE/test-venv/bin/devops-learn explain "Terraform state"

