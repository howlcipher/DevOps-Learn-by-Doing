name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: flake8 src tests projects/api_platform/app projects/api_platform/tests
      - name: Type check platform
        run: mypy
      - name: Type check demo app
        run: cd projects/api_platform && mypy app --strict
      - name: Test
        run: pytest
