[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devops-learn"
version = "0.1.0"
description = "AI mentored, learn by doing DevOps and platform engineering CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "flake8>=7.0",
    "mypy>=1.10",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
anthropic = [
    "anthropic>=0.34",
]
demo-app = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.scripts]
devops-learn = "devops_learn.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devops_learn"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["devops_learn"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "anthropic"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "projects/api_platform/tests"]
pythonpath = ["projects/api_platform"]
